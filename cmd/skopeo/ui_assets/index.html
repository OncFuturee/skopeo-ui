<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skopeo 镜像下载器</title>
    <style>
        body { font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f0f2f5; }
        .sidebar { width: 250px; background-color: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h1 { margin-top: 0; font-size: 22px; margin-bottom: 30px; font-weight: 600; }
        .nav-item { padding: 12px 15px; cursor: pointer; border-radius: 5px; margin-bottom: 5px; transition: background 0.3s; display: flex; align-items: center; }
        .nav-item:hover { background-color: #34495e; }
        .nav-item.active { background-color: #3498db; font-weight: 500; }
        .content { flex: 1; padding: 40px; overflow-y: auto; }
        .panel { display: none; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; }
        .panel.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: border-color 0.3s; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        button { padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 500; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #95a5a6; }
        button.secondary:hover { background-color: #7f8c8d; }
        pre { background-color: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #e9ecef; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; font-family: Consolas, monospace; font-size: 13px; }
        .error { color: #c0392b; background: #fadbd8; padding: 15px; border-radius: 6px; margin-top: 20px; border-left: 4px solid #c0392b; }
        .success { color: #27ae60; background: #e8f8f5; padding: 15px; border-radius: 6px; margin-top: 20px; border-left: 4px solid #27ae60; }
        h2 { margin-top: 0; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; margin-bottom: 25px; color: #2c3e50; }
        .hint { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
        .advanced-toggle { color: #3498db; cursor: pointer; font-size: 14px; margin-bottom: 15px; display: inline-block; }
        .advanced-section { display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Skopeo 工具箱</h1>
        <div class="nav-item active" onclick="showPanel('download')">下载镜像</div>
        <div class="nav-item" onclick="showPanel('search')">搜索与详情</div>
        <div class="nav-item" onclick="showPanel('settings')">设置 (登录)</div>
    </div>

    <div class="content">
        <!-- Download Panel -->
        <div id="download" class="panel active">
            <h2>下载镜像</h2>
            <div class="form-group">
                <label>源镜像 (支持输入 docker pull 命令)</label>
                <div style="display: flex; gap: 10px;">
                    <select id="dl-source-transport" style="width: 180px;">
                        <option value="docker://">docker:// (Registry)</option>
                        <option value="docker-daemon:">docker-daemon: (Local)</option>
                        <option value="oci:">oci: (OCI Directory)</option>
                        <option value="oci-archive:">oci-archive: (OCI Tar)</option>
                        <option value="docker-archive:">docker-archive: (Docker Tar)</option>
                        <option value="dir:">dir: (Directory)</option>
                    </select>
                    <input type="text" id="dl-source" placeholder="例如: docker pull coturn/coturn:edge-alpine" style="flex: 1;">
                </div>
                <div class="hint">示例: docker.io/library/alpine:latest, coturn/coturn:edge-alpine, 或直接粘贴 docker pull 命令</div>
            </div>
            
            <div class="form-group">
                <label>输出格式</label>
                <select id="dl-format" onchange="updateDestPlaceholder()">
                    <option value="docker-archive">Docker 归档 (.tar) - [推荐] 适用于 docker load</option>
                    <option value="oci-archive">OCI 归档 (.tar) - 适用于 podman load</option>
                    <option value="dir">目录 (解压层) - 保存到服务器</option>
                    <option value="oci">OCI 目录 - 保存到服务器</option>
                </select>
            </div>

            <div class="form-group" id="path-group">
                <label>输出文件名 (留空自动命名)</label>
                <input type="text" id="dl-path" placeholder="自动生成，如: coturn_edge-alpine.tar" style="width: 100%;">
                <div class="hint">下载归档的文件名。如果留空，将根据镜像名称自动生成。</div>
            </div>

            <div class="advanced-toggle" onclick="toggleAdvanced('dl-advanced')">显示高级选项</div>
            <div id="dl-advanced" class="advanced-section">
                <div class="form-group">
                    <label>覆盖操作系统 (OS)</label>
                    <input type="text" id="dl-os" placeholder="linux" value="linux">
                </div>
                <div class="form-group">
                    <label>覆盖架构 (Arch)</label>
                    <input type="text" id="dl-arch" placeholder="amd64" value="amd64">
                </div>
            </div>

            <button onclick="runDownload()">开始下载</button>
            <div id="dl-result"></div>
        </div>

        <!-- Search & Inspect Panel -->
        <div id="search" class="panel">
            <h2>搜索与详情</h2>
            <div class="form-group">
                <label>镜像名称</label>
                <input type="text" id="inspect-image" placeholder="docker://docker.io/library/alpine">
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="runInspect()">查看详情</button>
                <button class="secondary" onclick="runListTags()">列出标签</button>
            </div>
            <div id="inspect-result"></div>
        </div>

        <!-- Settings Panel -->
        <div id="settings" class="panel">
            <h2>仓库登录</h2>
            <div class="form-group">
                <label>仓库地址</label>
                <input type="text" id="login-registry" placeholder="docker.io">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password">
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="runLogin()">登录</button>
                <button class="secondary" onclick="runLogout()">登出</button>
            </div>
            <div id="login-result"></div>
        </div>
    </div>

    <script>
        function showPanel(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleAdvanced(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function updateDestPlaceholder() {
            const format = document.getElementById('dl-format').value;
            const pathInput = document.getElementById('dl-path');
            const pathGroup = document.getElementById('path-group');
            const label = pathGroup.querySelector('label');
            const hint = pathGroup.querySelector('.hint');
            
            if (format.includes('archive')) {
                // Browser download mode
                pathInput.placeholder = '自动生成，如: coturn_edge-alpine.tar';
                label.textContent = '输出文件名 (留空自动命名)';
                hint.textContent = '下载归档的文件名。如果留空，将根据镜像名称自动生成。';
            } else {
                // Server save mode
                pathInput.placeholder = './my-image-folder';
                label.textContent = '保存路径 (服务端)';
                hint.textContent = '镜像将在服务器上保存的路径。';
            }
        }

        async function runDownload() {
            let userSource = document.getElementById('dl-source').value.trim();
            let transport = document.getElementById('dl-source-transport').value;
            let path = document.getElementById('dl-path').value.trim();
            const format = document.getElementById('dl-format').value;
            const os = document.getElementById('dl-os').value;
            const arch = document.getElementById('dl-arch').value;
            const resultDiv = document.getElementById('dl-result');

            if (!userSource) {
                resultDiv.innerHTML = '<div class="error">请输入源镜像地址。</div>';
                return;
            }

            // 处理智能输入：docker pull ...
            if (userSource.startsWith('docker pull ')) {
                userSource = userSource.replace('docker pull ', '').trim();
                // 如果用户输入的是 docker pull，通常是不带 transport 的，强制使用 docker:// 
                // 但要先检查用户输入里是否已经包含了协议头（虽然 docker pull 通常不带）
                if (!userSource.includes('://')) {
                     transport = 'docker://';
                }
            }

            // 构建完整 Source
            let source = userSource;
            if (!source.includes('://')) {
                source = transport + source;
            }

            // 自动生成文件名 (如果是浏览器下载模式)
            const isBrowserDownload = format.includes('archive');
            if (isBrowserDownload && !path) {
                // 从 source 中提取有意义的名字
                // 移除 transport
                let tempName = source;
                if (tempName.includes('://')) {
                    tempName = tempName.split('://')[1];
                }
                
                // 处理 docker.io/library/ 前缀等，让文件名更短
                tempName = tempName.replace(/^docker\.io\/library\//, '');
                tempName = tempName.replace(/^docker\.io\//, '');
                
                // 将非法文件字符替换为 _
                // 例如: coturn/coturn:edge-alpine -> coturn_coturn_edge-alpine
                // 或者用户希望简单点，但为了保证唯一性，全称比较好，只是把 / 和 : 换成 _
                tempName = tempName.replace(/[\/:]/g, '_');
                
                path = tempName + '.tar';
            }
            
            if (isBrowserDownload) {
                // Browser download mode
                resultDiv.innerHTML = `准备下载...<br>源: ${source}<br>文件: ${path}<br>(根据镜像大小可能需要一些时间)`;
                
                try {
                    const res = await fetch('/api/download', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ source, format, filename: path, os, arch })
                    });
                    
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = path;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                        resultDiv.innerHTML = `<div class="success">下载成功！<br>文件: ${path}</div>`;
                    } else {
                        const text = await res.text();
                        resultDiv.innerHTML = `<div class="error">下载失败:<br>${text}</div>`;
                    }
                } catch (e) {
                    resultDiv.innerHTML = `<div class="error">网络错误: ${e.message}</div>`;
                }
            } else {
                if (!path) {
                    resultDiv.innerHTML = '<div class="error">在服务器保存模式下，必须指定保存路径。</div>';
                    return;
                }
                // Server save mode (directory formats)
                const destination = `${format}:${path}`;
                resultDiv.innerHTML = '正在保存到服务器... (根据镜像大小可能需要一些时间)';
                
                try {
                    const res = await fetch('/api/copy', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ source, destination, os, arch })
                    });
                    const text = await res.text();
                    if (res.ok) {
                        resultDiv.innerHTML = `<div class="success">保存成功！<br>路径: ${destination}<br><br>${text}</div>`;
                    } else {
                        resultDiv.innerHTML = `<div class="error">保存失败:<br>${text}</div>`;
                    }
                } catch (e) {
                    resultDiv.innerHTML = `<div class="error">网络错误: ${e.message}</div>`;
                }
            }
        }

        async function runInspect() {
            const image = document.getElementById('inspect-image').value;
            const resultDiv = document.getElementById('inspect-result');
            resultDiv.innerHTML = '正在加载详情...';
            try {
                const res = await fetch(`/api/inspect?image=${encodeURIComponent(image)}`);
                const text = await res.text();
                if (res.ok) {
                    try {
                        const json = JSON.parse(text);
                        resultDiv.innerHTML = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
                    } catch {
                        resultDiv.innerHTML = `<pre>${text}</pre>`;
                    }
                } else {
                    resultDiv.innerHTML = `<div class="error">${text}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="error">${e.message}</div>`;
            }
        }

        async function runListTags() {
            const image = document.getElementById('inspect-image').value;
            const resultDiv = document.getElementById('inspect-result');
            resultDiv.innerHTML = '正在加载标签...';
            try {
                const res = await fetch(`/api/list-tags?image=${encodeURIComponent(image)}`);
                const text = await res.text();
                if (res.ok) {
                    try {
                        const json = JSON.parse(text);
                        resultDiv.innerHTML = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
                    } catch {
                        resultDiv.innerHTML = `<pre>${text}</pre>`;
                    }
                } else {
                    resultDiv.innerHTML = `<div class="error">${text}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="error">${e.message}</div>`;
            }
        }

        async function runLogin() {
            const registry = document.getElementById('login-registry').value;
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const resultDiv = document.getElementById('login-result');
            
            resultDiv.innerHTML = '正在登录...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ registry, username, password })
                });
                const text = await res.text();
                if (res.ok) {
                    resultDiv.innerHTML = `<div class="success">${text}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">${text}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="error">${e.message}</div>`;
            }
        }

        async function runLogout() {
            const registry = document.getElementById('login-registry').value;
            const resultDiv = document.getElementById('login-result');
            
            if (!registry) {
                resultDiv.innerHTML = '<div class="error">请输入仓库地址以登出。</div>';
                return;
            }

            resultDiv.innerHTML = '正在登出...';
            try {
                const res = await fetch(`/api/logout?registry=${encodeURIComponent(registry)}`);
                const text = await res.text();
                if (res.ok) {
                    resultDiv.innerHTML = `<div class="success">${text}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">${text}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="error">${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
